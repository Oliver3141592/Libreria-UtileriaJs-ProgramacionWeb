<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .formulario {
            width: 320px;
            padding: 24px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #registro{
            text-align: center;
        }

        label { display: block; margin-bottom: 4px; }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .mensaje-error {
            color: red;
            font-size: 0.85rem;
            min-height: 1.2em;
            margin: 4px 0 8px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1><code>BIENVENIDO</code></h1>

    <form class="formulario" id="formulario">
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Escribe tu email">
            <p id="mensaje-error1" class="mensaje-error"></p>
        </div>


        <div>
            <label for="contra">Contraseña:</label>
            <input type="password" id="contra" placeholder="Escribe una contraseña">
            <p id="mensaje-error5" class="mensaje-error"></p>
        </div>

        <button type="submit">Ingresar</button>
        <br>


        <div id="registro">
            <br>
            <a href="index.html" class="boton">Registrarse</a>
        </div>
    </form>

    

        

    <script type="module">
        import { validarCorreo, validarPassword } from './js/utileria.js';

        const formulario = document.getElementById("formulario");
        const inputemail = document.getElementById("email");
        const inputContra = document.getElementById("contra");

        const mensajeError1 = document.getElementById("mensaje-error1");
        const mensajeError5 = document.getElementById("mensaje-error5");

        formulario.addEventListener("submit", evento => {

            // Empieza en true y cualquier validación que falle lo cambia a false
            let todoValido = true;

            //================CAMPOS VACÍOS=======================
            if (inputemail.value === '' || inputContra.value === '') {
                alert("Campos vacios");
                todoValido = false;
            }

            //================VALIDACIÓN DEL CORREO=======================
            if (validarCorreo(inputemail.value) == false) {
                mensajeError1.textContent = "Por favor, escribe tu email";
                todoValido = false;
            } else {
                mensajeError1.textContent = "";
            }

            
            //===================VALIDACIÓN DE CONTRASEÑA=======================
            if (validarPassword(inputContra.value) == false) {
                mensajeError5.textContent = "La contraseña no cumple con lo requerido";
                todoValido = false;
            } else {
                mensajeError5.textContent = "";
            }

            //===================RESULTADO FINAL=======================
            if (todoValido == false) {
                evento.preventDefault();   // un solo preventDefault para todo
            } else {
                alert("Exito");
            }

        });
    </script>
    
</body>
</html>
